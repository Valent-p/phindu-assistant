[project]
name = "phindu-assistant"
version = "0.1.0"
description = "A digital ledger and alternative credit-scoring plartform designed specifically for informal Malawian micro-merchants who struggle with traditional bookkeeping apps due to language or literacy barriers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.3.0",
    "pydantic-settings>=2.11.0",
    "uvicorn[standard]>=0.50.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "aiosqlite>=0.22.1",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "opensimplex>=0.4.5",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23.0",
    "ruff",
]

# Modern, extremely fast Python linter and formatter configuration (Ruff)
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"] # Enables PEP8 checks, imports sorting, etc.
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]