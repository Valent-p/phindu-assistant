<style>
    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes wiggle {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .animate-entrance-logo { animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-entrance-text { opacity: 0; animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
    .animate-entrance-field-1 { opacity: 0; animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
    .animate-entrance-field-2 { opacity: 0; animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
    .animate-entrance-button { opacity: 0; animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
    .animate-entrance-social { opacity: 0; animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; }
    .animate-entrance-footer { opacity: 0; animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }

    .wiggle { animation: wiggle 0.2s ease-in-out 0s 2; }

    .custom-input:focus-within {
      box-shadow: 0 0 0 2px rgba(81, 64, 179, 0.2);
      border-color: #5140b3;
    }
  </style>
</head>
<body class="bg-background font-body-md text-on-surface">
<main class="flex flex-col relative w-full min-h-screen">
<div class="flex flex-col w-full px-margin py-lg space-y-xl">
<!-- Brand & Welcome Section -->
<div class="flex flex-col items-center text-center space-y-md pt-lg">
<div class="animate-entrance-logo">
<div class="relative group">
<div class="absolute -inset-2 bg-gradient-to-r from-primary/20 to-tertiary/20 rounded-full blur-xl opacity-75 group-hover:opacity-100 transition duration-1000"></div>
<div class="relative w-24 h-24 bg-surface-container-highest rounded-[2rem] flex items-center justify-center shadow-lg overflow-hidden border border-white/50">
<img alt="Phindu Logo" class="w-full h-full object-cover p-3" src="https://lh3.googleusercontent.com/aida/AP1WRLvXw4Jd0VJBZKs_C_oXl02mrnobaZNv2lfjpBPQ_1yj7MIkiXMIQqvhW41hALhOuAcg27L43c7v6zk6RHlrjD43MaWnFwH9_Dmzp1vyFn2y7sLmH5cgfJfaNRASmr0iwv-b6F7kmjVSnUARQf-39y7UkE_OfareKVplSOqoiI8Fg52KepYQ5kFwAOrk8xNznl8A2n7PV3nfslSmBQePjkG-Qs-dWLA_3egDbQhggffYj6Bm_jaDFgWZQus"/>
</div>
</div>
</div>
<div class="space-y-sm animate-entrance-text">
<h1 class="font-display-lg text-display-lg text-on-surface">Welcome Back! 👋</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">
          We're so glad to see you again. Your personal assistance suite is ready.
        </p>
</div>
</div>
<!-- Login Form -->
<div class="flex flex-col space-y-lg">
<div class="space-y-md">
<!-- Email Input -->
<div class="space-y-xs animate-entrance-field-1">
<label class="font-label-md text-label-md text-on-surface font-bold px-1" for="email">Email Address</label>
<div class="relative custom-input rounded-2xl transition-all duration-200 border-2 border-transparent">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-16 pl-12 pr-4 bg-surface-container-low rounded-[inherit] font-body-md text-body-md text-on-surface outline-none transition-all border border-outline/10 focus:ring-0 focus:border-primary" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs animate-entrance-field-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface font-bold" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-all duration-200 hover:underline underline-offset-4" href="#">Forgot Password?</a>
</div>
<div class="relative custom-input rounded-2xl transition-all duration-200 border-2 border-transparent">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-16 pl-12 pr-14 bg-surface-container-low rounded-[inherit] font-body-md text-body-md text-on-surface outline-none transition-all border border-outline/10 focus:ring-0 focus:border-primary" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 h-10 w-10 flex items-center justify-center text-outline hover:text-primary transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-headline-md">visibility</span>
</button>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="animate-entrance-button pt-2">
<button class="w-full h-16 bg-primary text-on-primary rounded-2xl font-title-lg text-title-lg shadow-lg shadow-primary/20 hover:bg-primary-container active:scale-[0.98] hover:scale-[1.01] transition-all duration-300 flex items-center justify-center space-x-md group" id="loginBtn">
<span class="font-bold">Sign In to Dashboard</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</div>
<!-- Divider -->
<div class="flex items-center space-x-md py-2">
<div class="flex-1 h-[1px] bg-outline-variant/50"></div>
<span class="font-label-md text-label-md text-outline">or continue with</span>
<div class="flex-1 h-[1px] bg-outline-variant/50"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-gutter animate-entrance-social">
<button class="flex items-center justify-center h-16 bg-surface-container-highest rounded-2xl hover:bg-surface-variant active:scale-[0.98] transition-all duration-200 border border-outline/5">
<div class="w-6 h-6 flex items-center justify-center">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</div>
<span class="ml-3 font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center h-16 bg-surface-container-highest rounded-2xl hover:bg-surface-variant active:scale-[0.98] transition-all duration-200 border border-outline/5">
<svg class="w-6 h-6 text-[#1877F2]" fill="currentColor" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
<span class="ml-3 font-label-md text-label-md text-on-surface">Facebook</span>
</button>
</div>
<!-- Footer Link -->
<div class="pt-xl text-center animate-entrance-footer">
<p class="font-body-md text-body-md text-on-surface-variant">
        New to Phindu Assistance? 
        <a class="text-primary font-bold ml-1 hover:underline underline-offset-4 transition-all duration-200" href="#">Create Account</a>
</p>
</div>
<!-- Decorative Elements -->
<div class="fixed -bottom-20 -right-20 w-80 h-80 bg-primary/10 rounded-full blur-3xl -z-10 animate-pulse"></div>
<div class="fixed -top-20 -left-20 w-80 h-80 bg-tertiary/10 rounded-full blur-3xl -z-10 animate-pulse"></div>
</div>
<script>
    // Micro-interaction for password visibility
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = toggleBtn.querySelector('.material-symbols-outlined');

    toggleBtn.addEventListener('click', function() {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      
      // Accessibility update
      this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });

    // Login button feedback and validation simulation
    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');

    loginBtn.addEventListener('click', function() {
      // Basic validation visual feedback
      if (!emailInput.value || !passwordInput.value) {
        this.classList.add('wiggle');
        this.classList.replace('bg-primary', 'bg-error');
        
        setTimeout(() => {
          this.classList.remove('wiggle');
          this.classList.replace('bg-error', 'bg-primary');
        }, 500);
        return;
      }

      // Simulate loading state
      const originalContent = this.innerHTML;
      this.innerHTML = `
        <svg class="animate-spin h-6 w-6 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="ml-3 font-bold">Signing in...</span>
      `;
      this.disabled = true;

      // Simulate network delay
      setTimeout(() => {
        this.innerHTML = originalContent;
        this.disabled = false;
      }, 2000);
    });
  </script>
</main>
</body></html>
