<body class="bg-background font-body-md text-on-surface" data-mode="connect">
<main class="flex flex-col relative w-full min-h-[1024px]" data-stitch-vh="min-h-[1024px]===min-h-screen">
<div class="flex flex-col w-full px-margin py-lg space-y-xl">
<!-- Brand & Welcome Section -->
<div class="flex flex-col items-center text-center space-y-md pt-lg">
<div class="animate-entrance-logo">
<div class="relative group">
<div class="absolute -inset-1 bg-gradient-to-r from-primary/20 to-tertiary/20 rounded-full blur opacity-75 group-hover:opacity-100 transition duration-1000 group-hover:duration-200"></div>
<div class="relative w-24 h-24 bg-surface-container-highest rounded-3xl flex items-center justify-center shadow-md overflow-hidden">
<img alt="Phindu Logo" class="w-full h-full object-cover p-2" src="https://lh3.googleusercontent.com/aida/AP1WRLvXw4Jd0VJBZKs_C_oXl02mrnobaZNv2lfjpBPQ_1yj7MIkiXMIQqvhW41hALhOuAcg27L43c7v6zk6RHlrjD43MaWnFwH9_Dmzp1vyFn2y7sLmH5cgfJfaNRASmr0iwv-b6F7kmjVSnUARQf-39y7UkE_OfareKVplSOqoiI8Fg52KepYQ5kFwAOrk8xNznl8A2n7PV3nfslSmBQePjkG-Qs-dWLA_3egDbQhggffYj6Bm_jaDFgWZQus">
</div>
</div>
</div>
<div class="space-y-xs animate-entrance-text">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">welcome to Phindu Assistance&nbsp;</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[240px] mx-auto">
            Your personal Phindu assistance suite is ready for you.
          </p>
</div>
</div>
<!-- Login Form -->
<div class="flex flex-col space-y-lg">
<div class="space-y-md">
<!-- Email Input -->
<div class="space-y-sm animate-entrance-field-1">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative custom-input rounded-xl transition-all duration-200 border-2 border-transparent">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low rounded-[inherit] font-body-md text-body-md text-on-surface outline-none transition-all border-none focus:ring-0" id="email" placeholder="name@example.com" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-sm animate-entrance-field-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-all duration-200 hover:underline underline-offset-2" href="#">Forgot Password?</a>
</div>
<div class="relative custom-input rounded-xl transition-all duration-200 border-2 border-transparent">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-low rounded-[inherit] font-body-md text-body-md text-on-surface outline-none transition-all border-none focus:ring-0" id="password" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="animate-entrance-button">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-title-lg text-title-lg shadow-md hover:bg-primary-container active:scale-[0.97] hover:scale-[1.01] transition-all duration-300 flex items-center justify-center space-x-sm group" id="loginBtn">
<span>Sign In</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</div>
<!-- Divider -->
<div class="flex items-center space-x-md opacity-60">
<div class="flex-1 h-[1px] bg-outline-variant"></div>
<span class="font-label-md text-label-md text-outline">or continue with</span>
<div class="flex-1 h-[1px] bg-outline-variant"></div>
</div>
<!-- Social Logins -->

<div class="fixed -top-20 -left-20 w-64 h-64 bg-tertiary/5 rounded-full blur-3xl -z-10 animate-pulse"></div>
</div>
<script>
      // Micro-interaction for password visibility
      document.getElementById('togglePassword').addEventListener('click', function() {
        const input = document.getElementById('password');
        const icon = this.querySelector('.material-symbols-outlined');
        if (input.type === 'password') {
          input.type = 'text';
          icon.textContent = 'visibility_off';
        } else {
          input.type = 'password';
          icon.textContent = 'visibility';
        }
      });

      // Login button ripple/feedback and validation simulation
      const loginBtn = document.getElementById('loginBtn');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      loginBtn.addEventListener('click', function() {
        // Validation check
        if (!emailInput.value || !passwordInput.value) {
          this.classList.add('wiggle');
          this.classList.remove('bg-primary');
          this.classList.add('bg-error');
          
          setTimeout(() => {
            this.classList.remove('wiggle');
            this.classList.remove('bg-error');
            this.classList.add('bg-primary');
          }, 400);
          return;
        }

        const originalContent = this.innerHTML;
        this.innerHTML = `
          <svg class="animate-spin h-5 w-5 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="ml-3">Connecting...</span>
        `;
        this.classList.add('opacity-80');
        this.disabled = true;

        // Simulate network delay
        setTimeout(() => {
          this.innerHTML = originalContent;
          this.classList.remove('opacity-80');
          this.disabled = false;
        }, 1800);
      });
    </script>
</main>
